<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>窗口守門人</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 雨夜門診的 lo-fi 點陣小遊戲，氣氛放鬆，但規則一板一眼
   IDEA: 晚間美沙冬給藥窗口：玻璃窗外是排隊的多種族病人與雨中的城市夜景，桌上是證件、服藥卡、系統畫面
   PICTURE: 160×192 原生解析度的類人角色半身像（精靈、獸耳、獸人、魔族、人魚、吸血鬼、蜥蜴人、矮人），表情隨耐心變化
   COLOUR and TYPE: 冒險食堂（番茄紅、麵包色、灰青、暖白、深咖啡）＋夜間深咖啡；DotGothic16 標題與數字，Noto Sans TC 內文
   LAYOUT: 寬螢幕上下兩層（窗口／桌面＋動作列）；窄螢幕依序堆疊，動作列固定在底部 */
:root{color-scheme:light;--red:#C8553D;--red2:#A9432F;--bread:#F2D0A4;--teal:#588B8B;--teal2:#456F6F;--paper:#FFFDF8;--ink:#2D2A26;--mut:#6B5E55;--gold:#E0A458;--line:#2D2A26}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}body{position:relative;min-height:100vh;margin:0;background:var(--bread);color:var(--ink);font:16px/1.6 'Noto Sans TC',system-ui,sans-serif;overflow-x:clip}
.px{font-family:'DotGothic16','Noto Sans TC',monospace;letter-spacing:.02em}
button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none;border-radius:0;min-height:44px;border:3px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 14px;box-shadow:3px 3px 0 var(--line);transition:transform .06s}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
button:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed}
.wrap{max-width:1240px;margin:0 auto;padding:12px max(2vw,10px) 40px}
header{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;padding:6px 2px 10px}
header h1{margin:0;font-size:clamp(22px,3vw,32px);line-height:1.05;color:var(--red2)}
.hud{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--paper);border:3px solid var(--line);padding:2px 10px;font-size:15px;white-space:nowrap}
.chip b{color:var(--red2)}
.chip.click{cursor:pointer}
.booth{position:relative;border:4px solid var(--line);background:#3B2F2A;box-shadow:5px 5px 0 var(--line)}
#scene{display:block;width:100%;aspect-ratio:640/280;image-rendering:pixelated;image-rendering:crisp-edges}
.bubble{position:absolute;left:61%;top:7%;right:2.5%;background:var(--paper);border:3px solid var(--line);padding:8px 12px;font-size:clamp(17px,1.9vw,20px);line-height:1.45;box-shadow:3px 3px 0 var(--line);min-height:3.2em}
.bubble::before{content:"";position:absolute;left:-14px;top:22px;border:7px solid transparent;border-right-color:var(--line)}
.bubble.mad{background:#FCE3DC;border-color:var(--red2)}
.bubble .who{display:block;font-size:14px;color:var(--teal2)}
.me{position:absolute;left:2%;bottom:24%;max-width:34%;background:#588B8B;color:#FFFDF8;border:3px solid var(--line);padding:7px 12px;font-size:clamp(16px,1.8vw,19px);line-height:1.45;box-shadow:3px 3px 0 var(--line);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;pointer-events:none;z-index:3}
.me.show{opacity:1;transform:none}
/* 喊停大字演出 */
.cut{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:6;opacity:0}
.cut span{display:block;padding:.18em .7em .22em;font-family:'Noto Sans TC',sans-serif;font-weight:900;font-size:clamp(40px,8.5vw,96px);letter-spacing:.06em;color:#C8553D;background:#FFFDF8;border:5px solid #2D2A26;box-shadow:8px 8px 0 #2D2A26;transform:rotate(-6deg) skewX(-8deg);clip-path:polygon(0 12%,6% 0,30% 8%,52% 0,74% 7%,96% 0,100% 30%,96% 54%,100% 82%,92% 100%,66% 92%,44% 100%,20% 93%,3% 100%,0 70%,4% 44%);-webkit-text-stroke:2px #2D2A26;text-shadow:4px 4px 0 #F2D0A4}
.cut.catch span{color:#FFFDF8;background:#588B8B;text-shadow:4px 4px 0 #2D2A26}
.cut.oops span{font-size:clamp(28px,5vw,54px);color:#6B5E55;background:#EFE6D8;-webkit-text-stroke:0;text-shadow:none;transform:rotate(3deg);box-shadow:5px 5px 0 #2D2A26}
.cut.on{animation:cutIn .9s ease-out forwards}
.cut.on span{animation:cutPop .9s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes cutIn{0%{opacity:0}6%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes cutPop{0%{scale:2.4}18%{scale:.94}28%{scale:1.04}40%,100%{scale:1}}
.booth.flash::after{content:"";position:absolute;inset:0;background:#FFFDF8;z-index:5;pointer-events:none;animation:flash .28s ease-out forwards}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.booth.jolt{animation:shake .32s linear}
@media(prefers-reduced-motion:reduce){.cut.on span{animation:none}.booth.flash::after,.booth.jolt{animation:none}}
.me .who{display:block;font-size:14px;color:#F2D0A4}
.me::after{content:"";position:absolute;right:-14px;bottom:10px;border:7px solid transparent;border-left-color:var(--line)}
.pat{position:absolute;left:2%;top:6%;width:min(30%,240px);background:rgba(45,42,38,.82);border:3px solid var(--paper);padding:5px 8px;color:var(--paper);font-size:13px}
.pat .bar{height:10px;background:#5A4B43;border:2px solid var(--paper);margin-top:3px}
.pat .bar i{display:block;height:100%;width:100%;background:var(--teal);transition:width .2s linear}
.pat.l1 .bar i{background:var(--gold)}.pat.l2 .bar i,.pat.l3 .bar i{background:var(--red)}
.desk{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;margin-top:14px}
.docs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;background:#B9774F;border:4px solid var(--line);padding:12px;box-shadow:5px 5px 0 var(--line)}
.doc{background:var(--paper);border:3px solid var(--line);padding:10px 12px;position:relative}
.doc h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;gap:6px;border-bottom:3px dashed var(--bread);padding-bottom:4px}
.doc h3 span{font-size:12px;color:var(--mut)}
.doc.idc{background:#FFF6E8}
.doc.card{background:#F9E7E2}
.doc.sys{background:#22302F;color:#E9F3EF;border-color:#111}
.doc.sys h3{border-bottom-color:#456F6F}
.doc.sys h3 span{color:#9FC7C0}
.row{display:flex;gap:8px;align-items:baseline;justify-content:space-between;padding:2px 4px;margin:0 -4px;border:2px solid transparent}
.row .k{font-size:13px;color:var(--mut);white-space:nowrap}
.doc.sys .row .k{color:#9FC7C0}
.row .v{font-weight:700;text-align:right;white-space:nowrap}
.photo{display:block;width:80px;height:96px;image-rendering:pixelated;border:3px solid var(--line);background:#DCE9E6;margin:2px 0 6px}
.idtop{display:flex;gap:10px;align-items:flex-start}
.idtop .rows{flex:1}
.f.insp{cursor:crosshair;border-style:dashed;border-color:var(--teal)}
.f.sel{background:rgba(224,164,88,.35);border-color:var(--gold)}
.f.bad{background:rgba(200,85,61,.25);border-color:var(--red)}
.f.ok{background:rgba(88,139,139,.22);border-color:var(--teal)}
.warnv{color:var(--red)}
.doc.sys .warnv{color:#FF9F8A}
.tools{display:flex;flex-direction:column;gap:10px}
.tools .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools button.on{background:var(--teal);color:var(--paper)}
.acts{display:grid;gap:8px}
.acts button{font-size:17px;text-align:left;display:flex;justify-content:space-between;align-items:center}
.acts .give{background:var(--teal);color:var(--paper)}
.acts .hold{background:var(--gold)}
.acts .deny{background:var(--red);color:var(--paper)}
.acts kbd{font-family:'DotGothic16',monospace;font-size:13px;opacity:.8}
.log{background:var(--paper);border:3px solid var(--line);padding:8px 10px;font-size:14px;max-height:190px;overflow:auto}
.log p{margin:2px 0}
.log .g{color:var(--teal2)}.log .r{color:var(--red2)}.log .t{color:var(--mut)}
.hint{font-size:13px;color:var(--mut);margin:0}
.ov{position:absolute;top:0;left:0;right:0;bottom:0;min-height:100%;background:rgba(45,42,38,.62);display:none;align-items:flex-start;justify-content:center;padding:24px 12px;z-index:20}
.ov.show{display:flex}
.panel{background:var(--paper);border:4px solid var(--line);box-shadow:6px 6px 0 var(--line);max-width:760px;width:100%;padding:20px 22px}
.panel h2{margin:0 0 8px;font-size:clamp(24px,3.4vw,34px);line-height:1.1;color:var(--red2)}
.panel h3{margin:14px 0 6px;font-size:18px}
.panel ol,.panel ul{padding-left:1.3em;margin:6px 0}
.panel li{margin:4px 0}
.new{background:var(--gold);font-size:12px;padding:0 6px;margin-left:6px;border:2px solid var(--line)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.slip{border:3px dashed var(--red);background:#FCEDE8;padding:8px 12px;margin:8px 0}
.slip.cp{border-color:var(--gold);background:#FBF0DD}
.slip b{color:var(--red2)}
.big{font-size:clamp(40px,7vw,64px);line-height:1;color:var(--teal2)}
.titlepic{display:block;width:100%;image-rendering:pixelated;border:3px solid var(--line);background:#3B2F2A;margin:6px 0 10px}
.toast{background:var(--ink);color:var(--paper);padding:6px 12px;border:3px solid var(--line);font-size:15px;display:none}
.err{display:none;background:#FCE3DC;border:3px solid var(--red2);padding:8px 12px;font-size:13px;margin-top:10px}
.toast.show{display:block}
.choice{display:block;width:100%;text-align:left;margin:8px 0}
.foot{font-size:13px;color:var(--mut);margin-top:14px}
@media(prefers-reduced-motion:reduce){button,.pat .bar i{transition:none}}
.f{cursor:pointer}
.f:hover{border-color:var(--teal);border-style:dashed}
#scene{cursor:pointer}
.coach{display:none;margin-top:12px;background:var(--teal);color:var(--paper);border:3px solid var(--line);padding:8px 12px;font-size:16px;box-shadow:3px 3px 0 var(--line)}
.coach.show{display:block}
.coach b{color:#F2D0A4}
.pulse{animation:pulse 1s steps(2) infinite;outline:3px solid var(--gold);outline-offset:2px}
@keyframes pulse{50%{outline-color:transparent}}
.dwrap{position:relative}
.stamp{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) rotate(-12deg);border:6px solid;padding:4px 24px;font-size:clamp(34px,6vw,64px);font-family:'DotGothic16','Noto Sans TC',monospace;opacity:0;pointer-events:none;background:rgba(255,253,248,.6);white-space:nowrap;z-index:3}
.stamp.give{color:#3F6E6E;border-color:#3F6E6E}.stamp.hold{color:#9A6A1F;border-color:#9A6A1F}.stamp.deny{color:var(--red2);border-color:var(--red2)}
.stamp.on{animation:stampIn .12s steps(3) forwards}
@keyframes stampIn{0%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(2.3)}100%{opacity:.95;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}}
.hit .booth,.hit .dwrap{animation:shake .26s linear}
@keyframes shake{0%{transform:none}20%{transform:translate(0,6px)}40%{transform:translate(0,-4px)}60%{transform:translate(0,3px)}80%{transform:translate(0,-1px)}100%{transform:none}}
.notes{display:grid;gap:6px}
.note{background:#F7E3BF;border:2px solid var(--line);padding:5px 10px;font-size:14px;line-height:1.5}
.note b{color:var(--red2)}
.note .new{margin-left:0;margin-right:6px}
.mini{display:none}
.skip{position:absolute;right:2%;bottom:5%;background:rgba(45,42,38,.8);color:var(--paper);border:2px solid var(--paper);padding:2px 10px;font-size:13px;display:none}
.skip.show{display:block}
button.chip{min-height:32px;box-shadow:none;padding:2px 10px;font-size:15px}
.goalok{color:var(--teal2)!important}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
.stats span{background:#FFFDF8;border:2px solid var(--line);padding:6px 8px;display:flex;flex-direction:column;gap:2px;font-size:14px;color:#6B5E55;white-space:nowrap}
.stats b{font-family:'DotGothic16',monospace;font-size:22px;color:var(--ink);line-height:1.2;white-space:normal}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rev{list-style:none;padding:0;margin:8px 0}.rev li{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;padding:6px 36px 6px 10px;border-bottom:2px dotted #D8C7AE;position:relative;opacity:0;animation:revIn .3s forwards;animation-delay:var(--d)}
.epi li{padding-right:10px;line-height:1.6}.epi li.o{border-left:5px solid var(--teal)}.epi li.x{border-left:5px solid var(--red)}
.rev .mk{position:absolute;right:8px;top:4px;font-family:'DotGothic16',monospace;font-size:20px}.rev li.o .mk{color:var(--teal)}.rev li.x .mk{color:var(--red)}.rev li.x{background:#FCEDE8}
.after{opacity:0;animation:revIn .4s forwards;animation-delay:var(--d)}
@keyframes revIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rev li,.after{animation:none;opacity:1}}
canvas.rp{display:block;width:100%;max-width:520px;margin-top:6px;border:3px solid var(--line);image-rendering:pixelated}
.code{background:#FFFDF8;border:3px solid var(--line);padding:8px 12px;margin:10px 0}.code pre{white-space:pre-wrap;word-break:break-all;font-family:'Noto Sans TC',sans-serif;font-size:14px;margin:6px 0;background:#F2D0A4;padding:6px 8px;user-select:all}
.meaning{background:#EAF2EF;border:3px solid var(--teal);padding:8px 12px;margin:8px 0}
.meaning li{margin:3px 0}
.tabs{display:none;gap:4px}
.tabs button{flex:1;min-height:38px;padding:2px 4px;font-size:14px;box-shadow:none;border-width:2px;background:#E9BF8F}
.tabs button.on{background:var(--paper);border-bottom-color:var(--paper)}
.tabs button.ok{color:var(--teal2)}.tabs button.bad{color:var(--red2)}
#bLog{display:none}
#acts.sw{grid-template-columns:1fr}#acts.sw .stop{flex-direction:column;align-items:center;gap:2px;white-space:nowrap}#acts.sw .stop .mh{font-size:13px;letter-spacing:0}#acts.sw .stop kbd{display:none}#acts .stop{background:#C8553D!important;color:#FFFDF8!important;}#acts.sw .stop{justify-content:center;font-size:20px;min-height:56px;letter-spacing:.1em}
#acts.why{grid-template-columns:repeat(2,minmax(0,1fr))}#acts.why button{justify-content:center;min-height:44px;font-size:14px}
#acts.why .ghost{grid-column:1/-1;background:var(--paper);color:var(--ink)}
@media (max-width:900px),(max-height:520px){
.wrap{padding:6px 6px 12px}
header{padding:0 0 6px;gap:4px}
header h1{display:none}
.hud{gap:4px}
.chip{font-size:11px;padding:0 4px;border-width:2px}
.hud{flex-wrap:nowrap}header{flex-wrap:nowrap}
button.chip{min-height:26px}
#hGoal{display:none}
.booth{box-shadow:3px 3px 0 var(--line);border-width:3px}
.bubble{position:static;margin:0;border-width:0;border-top:3px solid var(--line);box-shadow:none;padding:5px 10px;font-size:17px;line-height:1.4;min-height:0}
.me{left:1.5%;bottom:auto;max-width:40%;font-size:16px;padding:4px 9px;border-width:2px}.me .who{font-size:12px;display:inline;margin-right:4px}.me::after{display:none}
.bubble::before{display:none}
.bubble .who{font-size:14px;display:inline;margin-right:6px}
.pat{font-size:11px;width:40%;padding:3px 6px;border-width:2px;top:5%}
.pat .bar{height:7px}
.skip{font-size:11px}
.coach{font-size:14px;padding:6px 10px;margin-top:6px}
.desk{display:flex;flex-direction:column;gap:8px;margin-top:8px;position:relative}
.tabs{display:flex;margin-bottom:-3px;position:relative;z-index:1}
.docs{display:block;padding:6px;box-shadow:3px 3px 0 var(--line);border-width:3px}
.docs .doc{display:none;padding:6px 10px}
.docs .doc.act{display:block}
.doc h3{font-size:14px;margin-bottom:2px}
.row{padding:1px 4px}.row .k{font-size:12px}.row .v{font-size:15px}
.photo{width:64px;height:77px}
.stamp{font-size:44px}
.tools{gap:6px}
#notes,.tools .hint,#log,#mini{display:none}
.acts{grid-template-columns:repeat(3,minmax(0,1fr));order:1}
.acts button{justify-content:center;font-size:16px;padding:4px;min-height:46px}
.acts kbd,.mh{display:none}
.tools .pair{order:2}
.tools .pair button{min-height:40px;padding:4px;font-size:14px}
.tools .pair .px{display:none}
#bLog{display:block}
body.swmode .tools .pair{display:none}
body.swmode #docs,body.swmode #tabs{display:none}
#acts.sw{grid-template-columns:1fr!important}#acts.why{grid-template-columns:1fr 1fr!important}#acts.sw .stop{min-height:48px;font-size:18px}#acts.sw kbd,#acts.why kbd{display:none}#acts.why button{min-height:38px;font-size:13px}
.toast{position:absolute;left:8px;right:8px;top:48px;z-index:6;font-size:14px;pointer-events:none;opacity:.94}
#hClock,.foot{display:none}
.tools .pair{grid-template-columns:repeat(4,minmax(0,1fr))}
.foot{font-size:11px;margin-top:8px}
.err{font-size:12px}
}
@media (orientation:landscape) and (max-height:520px){
.wrap{display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);gap:0 10px;align-items:start}
header,.err,.foot{grid-column:1/-1}
.booth{grid-column:1;grid-row:2}.coach{grid-column:1;grid-row:3}
.desk{grid-column:2;grid-row:2/span 2;margin-top:0}
}
.booth .stamp{z-index:4;top:46%;background:rgba(255,253,248,.82)}
/* 電腦版：一個畫面看完——左邊上方遊戲畫面、下方三份文件，右邊是蓋章按鈕與規則 */
@media (min-width:901px) and (min-height:521px){
  .wrap{max-width:1500px;display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-areas:"head head" "booth side" "coach side" "docs side" "foot foot";column-gap:16px;row-gap:10px;align-items:start;padding-bottom:10px}
  header{grid-area:head}
  .booth{grid-area:booth;justify-self:center;width:100%}
  .foot{display:none}
  .docs .row{padding-top:0;padding-bottom:0}
  .doc h3{margin-bottom:4px}
  .coach{grid-area:coach;margin-top:0}
  .desk{display:contents}
  .dwrap{grid-area:docs}
  .docs{padding:10px}
  .tools{grid-area:side;align-self:stretch;max-height:calc(100vh - 96px);position:sticky;top:8px;min-height:0}
  .tools .acts{order:-2}
  .tools .pair{order:-1}
  .tools .toast{order:-3}
  .notes{overflow:auto;flex:1 1 auto;min-height:100px;padding-right:4px}
  .tools .log{display:none}
  #bLog{display:block}
  .tools .hint{font-size:12px;margin:0}
  .err,.foot{grid-area:foot;margin-top:4px}
}
@media(prefers-reduced-motion:reduce){.stamp.on{animation:none;opacity:.95}.hit .booth,.hit .dwrap{animation:none}.pulse{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1 class="px">窗口守門人</h1>
  <div class="hud px">
    <span class="chip">第 <b id="hDay">1</b> 晚</span>
    <span class="chip f" id="hDate" data-k="date" title="可和有效期限、最後服藥比對">今日 <b id="hDateV">115/12/01</b></span>
    <span class="chip" id="hClock">17:00</span>
    <span class="chip">病人 <b id="hQ">1/6</b></span>
    <span class="chip">分數 <b id="hScore">0</b></span>
    <span class="chip">客訴 <b id="hCp">0</b></span>
    <span class="chip" id="hGoal">目標</span>
  </div>
</header>

<section class="booth" aria-label="給藥窗口">
  <canvas id="scene" width="640" height="280"></canvas>

  stamp(){if(!SND.on||!SND.ctx)return;tone(160,0,.18,'sine',.9,45);noise(.09,.7,1800)},
  good(){if(!SND.on||!SND.ctx)return;tone(880,.06,.12,'triangle',.18);tone(1320,.16,.18,'triangle',.16)},
  bad(){if(!SND.on||!SND.ctx)return;tone(140,.05,.32,'square',.12,110)},
  mad(l){if(!SND.on||!SND.ctx)return;tone(l>=3?120:180,0,.22,'sawtooth',.08+l*.03,l>=3?80:140)},
  slam(){if(!SND.on||!SND.ctx)return;noise(.12,.5,600)}
};
function rainOn(){const a=audio();if(!a||SND.rain)return;const n=a.sampleRate*2,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;s.loop=true;const fl=a.createBiquadFilter();fl.type='bandpass';fl.frequency.value=1400;fl.Q.value=.6;const g=a.createGain();g.gain.value=.018;s.connect(fl).connect(g).connect(a.destination);s.start();SND.rain=s}
function rainOff(){if(SND.rain){try{SND.rain.stop()}catch(e){}SND.rain=null}}
/* 背景音樂：咖啡廳抒情鋼琴（即時合成） */
const MUS={timer:null,next:0,step:0,bus:null,mel:72};
function impulse(a,sec){const n=Math.floor(a.sampleRate*sec),b=a.createBuffer(2,n,a.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)}return b}
function musicBus(){const a=SND.ctx;if(MUS.bus)return MUS.bus;const master=a.createGain();master.gain.value=.2;const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3000;const conv=a.createConvolver();conv.buffer=impulse(a,2.6);const wet=a.createGain();wet.gain.value=.4;lp.connect(master);lp.connect(conv);conv.connect(wet);wet.connect(master);master.connect(a.destination);MUS.bus=lp;MUS.master=master;return lp}
function piano(m,t,v,dur){const a=SND.ctx,f=440*Math.pow(2,(m-69)/12),g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(v*.32,t+.4);g.gain.exponentialRampToValueAtTime(.0001,t+dur);g.connect(musicBus());
  [[1,'triangle',1],[2,'sine',.32],[3,'sine',.1],[4.01,'sine',.04]].forEach(([h,ty,amp])=>{const o=a.createOscillator(),og=a.createGain();o.type=ty;o.frequency.value=f*h;og.gain.value=amp;o.connect(og).connect(g);o.start(t);o.stop(t+dur+.05)})}
const PROG=[[41,[57,60,64,67]],[40,[55,59,62,64]],[38,[53,57,60,64]],[43,[53,57,59,62]],[36,[52,55,59,62]],[45,[55,59,60,64]],[38,[53,57,60,65]],[43,[53,55,59,62]]];
const PENTA=[72,74,76,79,81,84];const E8=60/66/2;
function eighth(k,t){
  const bar=PROG[Math.floor(k/8)%PROG.length],i=k%8,hum=()=>(Math.random()-.5)*.02;
  if(i===0){piano(bar[0],t,.2,3.6);if(Math.random()<.35)bar[1].forEach(n=>piano(n,t+.01,.055,3))}
  if(i===4&&Math.random()<.5)piano(bar[0]+12,t+hum(),.1,2);
  const pat=[0,1,2,3,2,1,2,3];piano(bar[1][pat[i]],t+hum(),.075+Math.random()*.03,1.8);
  if(i%2===0&&Math.random()<.42){const tones=bar[1].map(n=>n+12).concat(PENTA);let best=tones[0];for(const n of tones)if(Math.abs(n-MUS.mel)<Math.abs(best-MUS.mel)&&Math.random()<.7)best=n;MUS.mel=Math.max(69,Math.min(86,best+(Math.random()<.5?0:pick1([-2,2,3,-3]))));piano(MUS.mel,t+hum(),.13+Math.random()*.04,2.4)}
}
function musicOn(){const a=audio();if(!a||MUS.timer)return;MUS.next=a.currentTime+.15;MUS.step=0;MUS.timer=setInterval(()=>{if(!SND.ctx)return;while(MUS.next<SND.ctx.currentTime+.3){eighth(MUS.step,MUS.next);MUS.next+=E8;MUS.step++}},60)}
function musicOff(){if(MUS.timer){clearInterval(MUS.timer);MUS.timer=null}}

function notesPanel(){const nr=RULES.filter(r=>r.day===day+1);show(`<h2 class="px">第 ${day+1} 晚的規則便條</h2><ol>${nr.map(r=>`<li><b>${r.t}</b>：${esc(r.x)}</li>`).join('')}</ol>${day===1?'<p class="meaning"><b>從今晚起是正式值班</b>：蓋章和喊停後不會再提示對錯，分數也先藏起來，下班稽核時一次揭曉。</p>':''}<p class="hint">隨時可以按「手冊」再看。看便條時耐心暫停。</p><div class="btns"><button id="cl">開始</button></div>`);$('#cl').onclick=hide}
$('#bAsk').onclick=()=>{
  if(phase!=='doc'||asked)return;const c=cur();asked=true;$('#bAsk').disabled=true;
  const q=c.q||'請問您叫什麼名字？今天狀況怎麼樣？',ans=idAns(c);logp(`你：${q}`,'t');
  if(c.hasty){waited=Math.min(limit*.97,waited+limit*.2);logp(`${c.name}：${ans}（看起來更不耐煩了）`,'r');qa(q,c.name,ans+'……還要問什麼？快點啦！',true);sfx.mad(1)}
  else{waited=Math.max(0,waited-limit*.12);logp(`${c.name}：${ans}`,'t');qa(q,c.name,ans)}
  const r=1-waited/limit;level=r<=.08?3:r<=.25?2:r<=.5?1:0;patUI();
};
document.addEventListener('keydown',e=>{
  if($('#ov').classList.contains('show')){if(e.key==='Escape'&&$('#cl'))hide();return}
  const k=e.key.toLowerCase();
  if(k==='r')$('#bRule').click();
  else if(k===' '&&phase==='swallow'){e.preventDefault();act('stop')}
  else if(['1','2','3','4','5','6'].includes(k)){if(pendingNext){skipNow();return}const b=$('#acts').querySelectorAll('button')[+k-1];if(b&&!b.disabled)b.click()}
});
if(location.hash==='#debug')window.__setc=(k,v)=>{const c=cur();if(c)c[k]=v};if(location.hash==='#debug')window.__wg=()=>({ans:cur()?cur().ans:null,anom:cur()?cur().anom:null,decoy:cur()?cur().decoy:null,phase,tut,wt:W?W.t:0,a0:W?W.a0:0,acc:W&&cur()&&phase==='swallow'?aAccept():false});
setActs('doc');titleScreen();requestAnimationFrame(loop);

})();

/* 電腦版：依視窗高度算出遊戲畫面寬度，讓畫面、文件、按鈕同時放得下 */
function fitDesk(){const b=document.querySelector('.booth');if(!b)return;
  if(!matchMedia('(min-width:901px) and (min-height:521px)').matches){b.style.width='';return}
  const head=document.querySelector('header').offsetHeight,coach=document.getElementById('coach'),ch=coach.classList.contains('show')?coach.offsetHeight+10:0;
  const docs=document.querySelector('.dwrap').offsetHeight,avail=innerHeight-head-ch-docs-72;
  const colW=document.querySelector('.dwrap').clientWidth;b.style.width=Math.max(320,Math.min(colW,Math.round(avail*640/280)))+'px'}
addEventListener('resize',fitDesk);
try{new MutationObserver(fitDesk).observe(document.getElementById('coach'),{attributes:true,childList:true,subtree:true})}catch(e){}
setTimeout(fitDesk,0);
window.__booted=true;var bd=document.getElementById('bootDiag');if(bd)bd.remove();
</script>
